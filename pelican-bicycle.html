<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1b2434;
    color: #e8eef7;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 18px 0 10px; letter-spacing: .06em; }
  .stage {
    width: min(96vw, 960px);
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    background: #8ec5ff;
  }
  svg { width: 100%; height: 100%; display: block; }
  .controls { margin: 14px 0 24px; display: flex; gap: 14px; align-items: center; font-size: 14px; }
  input[type=range] { width: 180px; accent-color: #f5a623; }
  button {
    background: #2f3d55; color: #fff; border: 0; padding: 6px 16px;
    border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #3c4d6b; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<div class="stage">
<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在乡间小路上骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb3ff"/>
      <stop offset="1" stop-color="#e9f4ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dc96f"/>
      <stop offset="1" stop-color="#4f9a48"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff5b0" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff5b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="660" cy="90" r="90" fill="url(#sunGlow)"/>
  <circle cx="660" cy="90" r="38" fill="#ffd95a"/>

  <!-- 远处的云（慢速视差） -->
  <g id="clouds" fill="#ffffff" opacity=".92">
    <g id="cloudSet">
      <g transform="translate(90 80)">
        <ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="34" cy="-12" rx="34" ry="24"/><ellipse cx="66" cy="2" rx="40" ry="18"/>
      </g>
      <g transform="translate(380 130)">
        <ellipse cx="0" cy="0" rx="36" ry="16"/><ellipse cx="28" cy="-10" rx="30" ry="20"/><ellipse cx="56" cy="2" rx="32" ry="14"/>
      </g>
      <g transform="translate(600 60)">
        <ellipse cx="0" cy="0" rx="30" ry="13"/><ellipse cx="22" cy="-8" rx="24" ry="16"/><ellipse cx="46" cy="2" rx="26" ry="12"/>
      </g>
    </g>
    <use href="#cloudSet" x="800"/>
  </g>

  <!-- 远山（中速视差） -->
  <g id="hills">
    <g id="hillSet">
      <path fill="#a9d7a0" d="M0 330 Q120 230 240 320 T480 315 T720 325 T800 330 V360 H0 Z"/>
      <path fill="#88c47e" d="M0 350 Q160 290 320 345 T640 340 T800 350 V370 H0 Z"/>
    </g>
    <use href="#hillSet" x="800"/>
  </g>

  <!-- 草地与马路 -->
  <rect x="0" y="360" width="800" height="90" fill="url(#grass)"/>
  <rect x="0" y="376" width="800" height="26" fill="#4d525d"/>
  <line id="roadDash" x1="0" y1="389" x2="800" y2="389" stroke="#f4e28a" stroke-width="3" stroke-dasharray="34 26"/>

  <!-- 路边小草（快速滚动） -->
  <g id="grassTufts" stroke="#3f8a3a" stroke-width="2.5" stroke-linecap="round" fill="none">
    <g id="tuftSet">
      <path d="M60 420 l-4 -12 M64 420 l2 -14 M68 420 l6 -10"/>
      <path d="M300 430 l-4 -12 M304 430 l2 -14 M308 430 l6 -10"/>
      <path d="M520 416 l-4 -12 M524 416 l2 -14 M528 416 l6 -10"/>
      <path d="M700 428 l-4 -12 M704 428 l2 -14 M708 428 l6 -10"/>
    </g>
    <use href="#tuftSet" x="800"/>
  </g>

  <!-- 影子 -->
  <ellipse cx="350" cy="399" rx="150" ry="6" fill="#000" opacity=".18"/>

  <!-- ====== 自行车 + 鹈鹕（整体轻微上下颠簸） ====== -->
  <g id="rider">

    <!-- 远侧曲柄与远侧腿（在车架后面） -->
    <line id="crankFar" stroke="#8a8f99" stroke-width="5" stroke-linecap="round"/>
    <polyline id="legFar" fill="none" stroke="#d8801f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <line id="footFar" stroke="#d8801f" stroke-width="7" stroke-linecap="round"/>

    <!-- 远侧翅膀 -->
    <path id="wingFar" fill="#e6e6e6" stroke="#bdbdbd" stroke-width="2"
          d="M292 186 Q345 178 405 218 L400 230 Q340 210 290 208 Z"/>

    <!-- 后轮 -->
    <g id="wheelRear" transform="translate(250 330)">
      <circle r="50" fill="none" stroke="#2b2f36" stroke-width="7"/>
      <circle r="44" fill="none" stroke="#c9ced8" stroke-width="3"/>
      <g stroke="#c9ced8" stroke-width="1.6">
        <line x1="0" y1="0" x2="44" y2="0"/><line x1="0" y1="0" x2="-44" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="44"/><line x1="0" y1="0" x2="0" y2="-44"/>
        <line x1="0" y1="0" x2="31" y2="31"/><line x1="0" y1="0" x2="-31" y2="-31"/>
        <line x1="0" y1="0" x2="31" y2="-31"/><line x1="0" y1="0" x2="-31" y2="31"/>
        <line x1="0" y1="0" x2="41" y2="16"/><line x1="0" y1="0" x2="-41" y2="-16"/>
        <line x1="0" y1="0" x2="16" y2="41"/><line x1="0" y1="0" x2="-16" y2="-41"/>
        <line x1="0" y1="0" x2="41" y2="-16"/><line x1="0" y1="0" x2="-41" y2="16"/>
        <line x1="0" y1="0" x2="16" y2="-41"/><line x1="0" y1="0" x2="-16" y2="41"/>
      </g>
      <circle r="6" fill="#8a8f99"/>
      <circle cx="0" cy="-44" r="3" fill="#f5a623"/>
    </g>

    <!-- 前轮 -->
    <g id="wheelFront" transform="translate(450 330)">
      <circle r="50" fill="none" stroke="#2b2f36" stroke-width="7"/>
      <circle r="44" fill="none" stroke="#c9ced8" stroke-width="3"/>
      <g stroke="#c9ced8" stroke-width="1.6">
        <line x1="0" y1="0" x2="44" y2="0"/><line x1="0" y1="0" x2="-44" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="44"/><line x1="0" y1="0" x2="0" y2="-44"/>
        <line x1="0" y1="0" x2="31" y2="31"/><line x1="0" y1="0" x2="-31" y2="-31"/>
        <line x1="0" y1="0" x2="31" y2="-31"/><line x1="0" y1="0" x2="-31" y2="31"/>
        <line x1="0" y1="0" x2="41" y2="16"/><line x1="0" y1="0" x2="-41" y2="-16"/>
        <line x1="0" y1="0" x2="16" y2="41"/><line x1="0" y1="0" x2="-16" y2="-41"/>
        <line x1="0" y1="0" x2="41" y2="-16"/><line x1="0" y1="0" x2="-41" y2="16"/>
        <line x1="0" y1="0" x2="16" y2="-41"/><line x1="0" y1="0" x2="-16" y2="41"/>
      </g>
      <circle r="6" fill="#8a8f99"/>
      <circle cx="0" cy="-44" r="3" fill="#f5a623"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#e0462f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M250 330 L335 322"/>           <!-- 后下叉 -->
      <path d="M250 330 L300 238"/>           <!-- 后上叉 -->
      <path d="M335 322 L300 238"/>           <!-- 座管 -->
      <path d="M300 238 L425 236"/>           <!-- 上管 -->
      <path d="M335 322 L425 236"/>           <!-- 下管 -->
      <path d="M425 236 L450 330"/>           <!-- 前叉 -->
      <path d="M425 236 L418 218"/>           <!-- 把立 -->
    </g>
    <!-- 链条 -->
    <path d="M250 330 m0 -12 L335 298 A26 26 0 0 1 335 348 L250 342 A12 12 0 0 1 250 318 Z"
          fill="none" stroke="#4a4f5a" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="335" cy="322" r="26" fill="none" stroke="#6a707c" stroke-width="3"/>
    <!-- 车座与车把 -->
    <path d="M280 238 Q300 228 322 236 Q300 244 280 238 Z" fill="#2b2f36"/>
    <path d="M300 238 L300 252" stroke="#8a8f99" stroke-width="5" stroke-linecap="round"/>
    <path d="M418 218 L438 214" stroke="#2b2f36" stroke-width="7" stroke-linecap="round"/>

    <!-- ====== 鹈鹕 ====== -->
    <g id="pelican">
      <!-- 尾羽 -->
      <path d="M255 205 L212 190 L226 210 L214 226 L258 222 Z" fill="#e6e6e6" stroke="#bdbdbd" stroke-width="2"/>
      <!-- 身体 -->
      <ellipse cx="296" cy="200" rx="54" ry="42" fill="#fafafa" stroke="#cfcfcf" stroke-width="2" transform="rotate(-14 296 200)"/>
      <!-- 脖子 -->
      <path d="M330 178 Q352 150 354 118" fill="none" stroke="#fafafa" stroke-width="22" stroke-linecap="round"/>
      <path d="M330 178 Q352 150 354 118" fill="none" stroke="#cfcfcf" stroke-width="24" stroke-linecap="round" opacity=".35"/>
      <path d="M330 178 Q352 150 354 118" fill="none" stroke="#fafafa" stroke-width="20" stroke-linecap="round"/>
      <!-- 头 -->
      <g id="head">
        <circle cx="358" cy="108" r="22" fill="#fafafa" stroke="#cfcfcf" stroke-width="2"/>
        <!-- 头顶小羽毛 -->
        <path d="M348 88 q-6 -12 2 -18 M356 86 q-2 -14 8 -18" fill="none" stroke="#fafafa" stroke-width="4" stroke-linecap="round"/>
        <!-- 下喙 + 喉囊 -->
        <path id="pouch" d="M372 110 Q412 160 470 118 L372 118 Z" fill="#f7b267" stroke="#d98a2f" stroke-width="2"/>
        <!-- 上喙 -->
        <path d="M370 102 L476 114 L370 112 Z" fill="#f5a623" stroke="#d98a2f" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="474" cy="114" r="2.5" fill="#d98a2f"/>
        <!-- 眼睛 -->
        <circle cx="366" cy="102" r="6" fill="#fff" stroke="#999" stroke-width="1"/>
        <circle cx="368" cy="102" r="3" fill="#1b1b1b"/>
        <circle cx="369.2" cy="100.8" r="1" fill="#fff"/>
        <!-- 小帽子 -->
        <path d="M338 96 Q358 72 380 90 L382 96 Z" fill="#e0462f"/>
        <rect x="334" y="94" width="50" height="5" rx="2.5" fill="#b8321f"/>
      </g>
    </g>

    <!-- 近侧腿（在车架前面） -->
    <polyline id="legNear" fill="none" stroke="#f0952b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <line id="footNear" stroke="#f0952b" stroke-width="8" stroke-linecap="round"/>
    <line id="crankNear" stroke="#a7acb6" stroke-width="5" stroke-linecap="round"/>
    <rect id="pedalNear" width="18" height="6" rx="2" fill="#2b2f36"/>

    <!-- 近侧翅膀，扶着车把 -->
    <path id="wingNear" fill="#fafafa" stroke="#cfcfcf" stroke-width="2"
          d="M300 182 Q360 170 424 214 Q428 222 420 226 Q356 200 296 206 Z"/>
    <path d="M414 212 q6 -6 12 -2 M410 218 q8 -6 14 0" fill="none" stroke="#cfcfcf" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
</div>

<div class="controls">
  <label>速度 <input id="speed" type="range" min="0.2" max="3" step="0.1" value="1.2"></label>
  <button id="toggle">暂停</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // ---- 几何常量（与 SVG 中坐标一致）----
  const WHEEL_R = 50;
  const CRANK = { x: 335, y: 322 };   // 中轴
  const CRANK_R = 24;                 // 曲柄长度
  const HIP = { x: 300, y: 250 };     // 髋关节（坐在车座上）
  const THIGH = 58, SHIN = 60;        // 大腿 / 小腿长度

  const wheelRear = $('wheelRear'), wheelFront = $('wheelFront');
  const clouds = $('clouds'), hills = $('hills'), tufts = $('grassTufts'), roadDash = $('roadDash');
  const rider = $('rider'), pelican = $('pelican'), pouch = $('pouch'), wingFar = $('wingFar');

  // 两段式反向运动学：给定髋与脚踏位置，求膝盖位置（膝盖朝前）
  function solveKnee(hip, target, l1, l2) {
    const dx = target.x - hip.x, dy = target.y - hip.y;
    const d = Math.hypot(dx, dy);
    const dc = Math.min(l1 + l2 - 0.5, Math.max(Math.abs(l1 - l2) + 0.5, d));
    const a = Math.acos((l1 * l1 + dc * dc - l2 * l2) / (2 * l1 * dc));
    const base = Math.atan2(dy, dx);
    const k1 = { x: hip.x + l1 * Math.cos(base - a), y: hip.y + l1 * Math.sin(base - a) };
    const k2 = { x: hip.x + l1 * Math.cos(base + a), y: hip.y + l1 * Math.sin(base + a) };
    return k1.x > k2.x ? k1 : k2;
  }

  function drawLeg(angle, legEl, footEl, crankEl, pedalEl) {
    const pedal = { x: CRANK.x + CRANK_R * Math.cos(angle), y: CRANK.y + CRANK_R * Math.sin(angle) };
    const knee = solveKnee(HIP, pedal, THIGH, SHIN);
    legEl.setAttribute('points', `${HIP.x},${HIP.y} ${knee.x},${knee.y} ${pedal.x},${pedal.y - 4}`);
    footEl.setAttribute('x1', pedal.x - 9); footEl.setAttribute('y1', pedal.y - 4);
    footEl.setAttribute('x2', pedal.x + 11); footEl.setAttribute('y2', pedal.y - 4);
    crankEl.setAttribute('x1', CRANK.x); crankEl.setAttribute('y1', CRANK.y);
    crankEl.setAttribute('x2', pedal.x); crankEl.setAttribute('y2', pedal.y);
    if (pedalEl) { pedalEl.setAttribute('x', pedal.x - 9); pedalEl.setAttribute('y', pedal.y - 3); }
  }

  let running = true, last = performance.now(), crankAngle = 0;
  const speedInput = $('speed');

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running) {
      const rps = parseFloat(speedInput.value);          // 曲柄每秒转数
      crankAngle += dt * rps * Math.PI * 2;
    }
    const wheelAngle = crankAngle * 2.6;                 // 齿比
    const dist = wheelAngle * WHEEL_R;                   // 走过的路程（像素）
    const deg = wheelAngle * 180 / Math.PI;

    wheelRear.setAttribute('transform', `translate(250 330) rotate(${deg})`);
    wheelFront.setAttribute('transform', `translate(450 330) rotate(${deg})`);

    // 背景视差
    clouds.setAttribute('transform', `translate(${-(dist * 0.08) % 800} 0)`);
    hills.setAttribute('transform', `translate(${-(dist * 0.3) % 800} 0)`);
    tufts.setAttribute('transform', `translate(${-dist % 800} 0)`);
    roadDash.setAttribute('stroke-dashoffset', dist % 60);

    // 骑行颠簸 + 身体轻微前后摆
    const bob = Math.sin(crankAngle * 2) * 1.6;
    rider.setAttribute('transform', `translate(0 ${bob})`);
    const sway = Math.sin(crankAngle) * 1.5;
    pelican.setAttribute('transform', `rotate(${sway} 300 250)`);
    pouch.setAttribute('transform', `translate(0 ${Math.sin(crankAngle * 2 + 1) * 2})`);
    wingFar.setAttribute('transform', `rotate(${Math.sin(crankAngle * 2) * 3} 292 186)`);

    // 双腿相差 180°
    drawLeg(crankAngle, $('legNear'), $('footNear'), $('crankNear'), $('pedalNear'));
    drawLeg(crankAngle + Math.PI, $('legFar'), $('footFar'), $('crankFar'), null);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  $('toggle').addEventListener('click', e => {
    running = !running;
    e.target.textContent = running ? '暂停' : '继续';
  });
})();
</script>
</body>
</html>
